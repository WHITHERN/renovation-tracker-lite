<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renovation Budget &amp; Bid Tracker — Free Lite</title>
<style>
:root{
  --bg:#faf6ef; --card:#fffdf8; --ink:#2b2118; --muted:#8a7661; --line:#e8dcc8;
  --accent:#b45309; --accent-dark:#92400e; --ok:#047857; --warn:#b45309; --bad:#b91c1c;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
nav.tabs{margin-left:12px;display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
nav.tabs button.active{background:#f3e6cf;color:var(--accent-dark);font-weight:600}
nav.tabs button:hover{background:#f5eee1}
.samplebar{margin-left:auto;display:flex;align-items:center;gap:10px}
.samplebadge{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.5px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.btn:hover{background:#faf4e8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.danger{color:var(--bad);border-color:#f3c2c2}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1080px;margin:24px auto;padding:0 20px 60px}
.view{display:none}.view.active{display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.card .big{font-size:28px;font-weight:700}
.card .sub{color:var(--muted);font-size:12px;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.panel h2{margin:0 0 12px;font-size:16px}
.rowhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.rowhead h2{margin:0;font-size:16px}
table.grid{width:100%;border-collapse:collapse}
table.grid th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.grid td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.3px}
.pill.paid{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.pill.overdue{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.pill.upcoming{background:#f3e6cf;color:#92400e;border:1px solid #e8d3a8}
.pill.winner{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.pill.over{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.pill.okay{background:#e7e2d6;color:#5b5344;border:1px solid #d6cdb8}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
form.f{display:grid;gap:12px}
label.fld{display:grid;gap:4px;font-size:13px}
label.fld span{font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;font-family:inherit;background:#fff}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal-root{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(17,24,39,.5);z-index:50;overflow:auto;padding:32px 16px}
#modal-root.open{display:flex}
.modal{background:#fffdf8;border-radius:12px;max-width:640px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal ul.pro{line-height:1.8;margin:8px 0;padding-left:22px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#292018;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99;font-size:13px}
#printSheet{display:none}
.hint{font-size:12px;color:var(--muted)}
.attn{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.attn li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
@media (max-width:720px){.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}

/* ---------- Lite edition ---------- */
.litepill{background:#fbbf24;color:#292018;font-weight:800;font-size:10.5px;letter-spacing:.6px;padding:3px 9px;border-radius:999px;vertical-align:middle}
#litebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#292018;color:#e5e7eb;font-size:12.5px;padding:9px 18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.15);flex-wrap:wrap}
#litebar a{color:#fbbf24;font-weight:700;text-decoration:none}
#litebar a:hover{text-decoration:underline}
body{padding-bottom:52px}

/* ---------- Print: professional project report ---------- */
@media print{
  #app,#modal-root,#toast,#litebar,.litepill,.upgradebtn{display:none !important}
  #printSheet{display:block !important}
  body{background:#fff}
}
body.print-preview #app,body.print-preview #modal-root,body.print-preview #toast,body.print-preview #litebar,body.print-preview .litepill,body.print-preview .upgradebtn{display:none !important}
body.print-preview #printSheet{display:block !important;background:#fff}
.doc{max-width:780px;margin:0 auto;padding:40px;color:#111;font-size:14px}
.doc .doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #92400e;padding-bottom:18px;margin-bottom:24px}
.doc .logo{font-size:26px;font-weight:800;letter-spacing:.3px}
.doc .biz{color:#4b5563;font-size:12.5px;white-space:pre-line;margin-top:6px}
.doc .reptitle{text-align:right}
.doc .reptitle h1{margin:0;font-size:24px;letter-spacing:1px}
.doc .reptitle .num{color:#4b5563;font-size:13px;margin-top:4px}
.doc h3{margin:26px 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:#92400e}
.doc table{width:100%;border-collapse:collapse;margin-bottom:8px}
.doc th{background:#292018;color:#fff;text-align:left;padding:9px 10px;font-size:12px}
.doc th.r,.doc td.r{text-align:right}
.doc td{padding:9px 10px;border-bottom:1px solid #e5e7eb}
.doc .dtotal{width:300px;margin-left:auto}
.doc .dtotal .r{display:flex;justify-content:space-between;padding:4px 0}
.doc .dtotal .grand{font-weight:800;font-size:16px;border-top:2px solid #292018;padding-top:8px;margin-top:4px}
.doc .winner-row{background:#f0fdf4}
.doc .foot{margin-top:36px;padding-top:12px;border-top:1px solid #e5e7eb;font-size:11.5px;color:#9ca3af;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span id="brandLogo">Renovation Tracker</span> <span class="litepill">LITE</span><small>free &middot; offline &middot; 1 project max</small></div>
    <nav class="tabs">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="budget">Budget</button>
      <button data-view="bids">Bids</button>
      <button data-view="payments">Payments</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="samplebar">
      <span class="samplebadge" id="sampleBadge" style="display:none">SAMPLE DATA</span>
      <button class="btn small" id="clearSampleBtn" style="display:none">Clear sample data</button>
    </div>
  </header>
  <main>
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-budget"></section>
    <section class="view" id="view-bids"></section>
    <section class="view" id="view-payments"></section>
    <section class="view" id="view-settings"></section>
  </main>
</div>
<div id="printSheet"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="litebar"><span class="litepill">FREE LITE</span><span>Free Lite version — 1 project, 8 budget lines, 2 jobs, 3 draws.</span><a id="liteUpgradeLink" href="https://daltonyogurt.gumroad.com/l/iczhnh" target="_blank" rel="noopener">Go Pro: pay once, own it forever &rarr;</a></div>
<div id="autotest-output" style="display:none"></div>
<script>
"use strict";
/* ============================================================
   Home Renovation Budget & Bid Tracker — single file, fully offline.
   All data lives in your browser's localStorage. Nothing is
   ever sent anywhere.
   ============================================================ */
/* LITE EDITION: wire this to the real product URL before launch. */
const UPGRADE_URL = "https://daltonyogurt.gumroad.com/l/iczhnh";
const LITE_LINE_LIMIT = 8;
const LITE_JOB_LIMIT = 2;
const LITE_BID_PER_JOB = 2;
const LITE_DRAW_LIMIT = 3;
const LS_KEY = "renoTrackerLite.v1";

const todayISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const addDays = (iso, n) => { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => { if(!iso) return "—"; const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); };

let DB = null;
function money(n){
  const cur = (DB && DB.settings.currency) || "USD";
  try { return new Intl.NumberFormat(undefined,{style:"currency",currency:cur}).format(n||0); }
  catch(e){ return "$"+Number(n||0).toFixed(2); }
}

function defaultDB(){
  return {
    settings:{ projectName:"", address:"", currency:"USD", contingencyPct:10 },
    budgetLines:[], jobs:[], payments:[]
  };
}
function load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ DB=JSON.parse(raw); return; } }catch(e){} DB=defaultDB(); seedSample(); save(); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ toast("Could not save (storage unavailable)."); } }

function seedSample(){
  const t = todayISO();
  DB.settings = { projectName:"SAMPLE — Maple St Kitchen Remodel", address:"123 Maple St\nSpringfield, IL 62701", currency:"USD", contingencyPct:10 };
  DB.budgetLines = [
    {id:uid(), room:"Kitchen", desc:"Cabinets & hardware", budget:12000, spent:11500, isSample:true},
    {id:uid(), room:"Kitchen", desc:"Countertops (quartz)", budget:4500, spent:4800, isSample:true},
    {id:uid(), room:"Kitchen", desc:"Appliances", budget:6000, spent:5900, isSample:true},
    {id:uid(), room:"Kitchen", desc:"Flooring & tile", budget:3800, spent:2100, isSample:true},
    {id:uid(), room:"Kitchen", desc:"Lighting & electrical", budget:2200, spent:2200, isSample:true},
    {id:uid(), room:"Kitchen", desc:"Paint & finishes", budget:1500, spent:400, isSample:true}
  ];
  const j1 = uid();
  DB.jobs = [
    {id:j1, title:"Cabinet installation", notes:"Install + trim out new cabinets", isSample:true, winnerId:null,
     bids:[
       {id:uid(), contractor:"Maple City Carpentry", amount:3850, notes:"Includes hardware install; 2-week lead"},
       {id:uid(), contractor:"Riverbend Remodeling", amount:4200, notes:"Includes haul-away of old cabinets"}
     ]}
  ];
  DB.jobs[0].winnerId = DB.jobs[0].bids[0].id;
  DB.payments = [
    {id:uid(), label:"Draw 1 — 50% deposit", amount:15000, dueDate:addDays(t,-10), paidDate:addDays(t,-10), isSample:true},
    {id:uid(), label:"Draw 2 — cabinets installed", amount:12000, dueDate:addDays(t,14), paidDate:"", isSample:true}
  ];
}
function clearSample(){
  DB.budgetLines = DB.budgetLines.filter(l=>!l.isSample);
  DB.jobs = DB.jobs.filter(j=>!j.isSample);
  DB.payments = DB.payments.filter(p=>!p.isSample);
  save(); renderAll(); toast("Sample data cleared.");
}

/* ---------- math ---------- */
function budgetTotals(){
  let budget=0, spent=0;
  DB.budgetLines.forEach(l=>{ budget += Number(l.budget)||0; spent += Number(l.spent)||0; });
  return { budget, spent, remaining: budget-spent };
}
function roomSubtotals(){
  const m = {};
  DB.budgetLines.forEach(l=>{
    const r = (String(l.room||"").trim() || "—");
    if(!m[r]) m[r] = {room:r, budget:0, spent:0};
    m[r].budget += Number(l.budget)||0; m[r].spent += Number(l.spent)||0;
  });
  return Object.values(m).map(o=>Object.assign(o,{remaining:o.budget-o.spent}));
}
function lineOverUnder(l){ return (Number(l.budget)||0) - (Number(l.spent)||0); }
function drawStatus(d){
  if(d.paidDate) return "paid";
  if(d.dueDate && d.dueDate < todayISO()) return "overdue";
  return "upcoming";
}
function jobWinner(job){ return job.bids.find(b=>b.id===job.winnerId) || null; }
function drawsTotalPaid(){ return DB.payments.reduce((s,d)=> s + (d.paidDate ? (Number(d.amount)||0) : 0), 0); }

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display="none",2600); }

/* ---------- Lite edition: caps + upgrade nudge ---------- */
function canAddLine(){ return DB.budgetLines.length < LITE_LINE_LIMIT; }
function canAddJob(){ return DB.jobs.length < LITE_JOB_LIMIT; }
function canAddBid(job){ return job.bids.length < LITE_BID_PER_JOB; }
function canAddDraw(){ return DB.payments.length < LITE_DRAW_LIMIT; }
function showUpgradeNudge(headline){
  openModal(`
    <h2>${esc(headline)}</h2>
    <p>The free Lite version is a great way to try everything out on a single project — but it does have limits.</p>
    <p><strong>Go Pro</strong> and unlock:</p>
    <ul class="pro">
      <li><strong>Unlimited</strong> budget lines, jobs, bids &amp; payment draws</li>
      <li><strong>Multiple projects</strong> — track every renovation in one place</li>
      <li><strong>Full spreadsheet version</strong> + lifetime updates — <strong>pay once, own it forever</strong></li>
    </ul>
    <div class="foot"><button type="button" class="btn" data-close>Not now</button>
    <a class="btn primary upgradebtn" style="text-decoration:none" href="${esc(UPGRADE_URL)}" target="_blank" rel="noopener">Get the full version — $24 once</a></div>`);
  modalRoot().querySelector("[data-close]").onclick = closeModal;
}

/* ---------- persist (caps enforced here) ---------- */
function persistLine(id, d){
  if(!id && !canAddLine()){ showUpgradeNudge("Lite covers 8 budget lines — Pro is unlimited"); return false; }
  if(id){ Object.assign(DB.budgetLines.find(l=>l.id===id), d); }
  else { DB.budgetLines.push(Object.assign({id:uid()}, d)); }
  save(); renderAll(); toast(id?"Budget line updated.":"Budget line added."); return true;
}
function persistJob(id, d){
  if(!id && !canAddJob()){ showUpgradeNudge("Lite covers 2 jobs — Pro is unlimited"); return false; }
  if(id){ Object.assign(DB.jobs.find(j=>j.id===id), d); }
  else { DB.jobs.push(Object.assign({id:uid(), bids:[], winnerId:null}, d)); }
  save(); renderAll(); toast(id?"Job updated.":"Job added."); return true;
}
function persistBid(jobId, d){
  const job = DB.jobs.find(j=>j.id===jobId); if(!job) return false;
  if(!canAddBid(job)){ showUpgradeNudge("Lite covers 2 bids per job — Pro is unlimited"); return false; }
  job.bids.push(Object.assign({id:uid()}, d));
  save(); renderAll(); toast("Bid added."); return true;
}
function persistDraw(id, d){
  if(!id && !canAddDraw()){ showUpgradeNudge("Lite covers 3 payment draws — Pro is unlimited"); return false; }
  if(id){ Object.assign(DB.payments.find(p=>p.id===id), d); }
  else { DB.payments.push(Object.assign({id:uid()}, d)); }
  save(); renderAll(); toast(id?"Draw updated.":"Draw added."); return true;
}

/* ---------- router ---------- */
function showView(name){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active", v.id==="view-"+name));
}
document.querySelector("nav.tabs").addEventListener("click", e=>{ const b=e.target.closest("button[data-view]"); if(b) showView(b.dataset.view); });
document.getElementById("clearSampleBtn").addEventListener("click", ()=>{ if(confirm("Remove all sample data? Your own data stays.")) clearSample(); });
function refreshSampleBar(){
  const has = DB.budgetLines.some(l=>l.isSample) || DB.jobs.some(j=>j.isSample) || DB.payments.some(p=>p.isSample);
  document.getElementById("sampleBadge").style.display = has?"inline-block":"none";
  document.getElementById("clearSampleBtn").style.display = has?"inline-block":"none";
}

/* ---------- rendering ---------- */
function overPill(l){
  const ou = lineOverUnder(l);
  return ou < 0
    ? `<span class="pill over">Over ${money(-ou)}</span>`
    : `<span class="pill okay">${money(ou)} left</span>`;
}
function drawPill(d){
  const s = drawStatus(d);
  const label = {paid:"Paid",overdue:"Overdue",upcoming:"Upcoming"}[s];
  return `<span class="pill ${s}">${label}</span>`;
}

function renderDashboard(){
  const el = document.getElementById("view-dashboard");
  const t = budgetTotals();
  const cont = t.budget * (Number(DB.settings.contingencyPct)||0) / 100;
  const rooms = roomSubtotals();
  const overLines = DB.budgetLines.filter(l=>lineOverUnder(l)<0);
  const overdueDraws = DB.payments.filter(d=>drawStatus(d)==="overdue");
  const undecided = DB.jobs.filter(j=>j.bids.length && !jobWinner(j));
  const attn = [];
  overLines.forEach(l=>attn.push(`<li><strong>${esc(l.room)} — ${esc(l.desc)}</strong> is <strong style="color:var(--bad)">${money(-lineOverUnder(l))} over budget</strong>.</li>`));
  overdueDraws.forEach(d=>attn.push(`<li><strong>${esc(d.label)}</strong> (${money(d.amount)}) was due ${fmtDate(d.dueDate)} — <strong style="color:var(--bad)">overdue</strong>.</li>`));
  undecided.forEach(j=>attn.push(`<li>Job <strong>${esc(j.title)}</strong> has ${j.bids.length} bid${j.bids.length>1?"s":""} — pick a winner in the Bids tab.</li>`));
  el.innerHTML = `
    <div class="cards">
      <div class="card"><h3>Total budget</h3><div class="big">${money(t.budget)}</div><div class="sub">${DB.budgetLines.length} budget line${DB.budgetLines.length===1?"":"s"}${cont?` &middot; ${money(cont)} contingency (${esc(DB.settings.contingencyPct)}%)`:``}</div></div>
      <div class="card"><h3>Spent to date</h3><div class="big">${money(t.spent)}</div><div class="sub">${money(drawsTotalPaid())} paid out in draws</div></div>
      <div class="card"><h3>Budget remaining</h3><div class="big" style="color:${t.remaining<0?"var(--bad)":"var(--ok)"}">${money(t.remaining)}</div><div class="sub">${t.remaining<0?"Over budget overall":"Still available to spend"}</div></div>
    </div>
    <div class="panel">
      <div class="rowhead"><h2>Needs attention (${attn.length})</h2><button class="btn primary small" data-act="print-report">Print report</button></div>
      ${attn.length?`<ul class="attn">${attn.join("")}</ul>`:`<div class="empty">All clear — nothing over budget, overdue, or undecided.</div>`}
    </div>
    <div class="panel">
      <div class="rowhead"><h2>Budget by room</h2></div>
      ${rooms.length?`<table class="grid"><thead><tr><th>Room</th><th class="num">Budget</th><th class="num">Spent</th><th class="num">Remaining</th></tr></thead><tbody>
        ${rooms.map(r=>`<tr><td><strong>${esc(r.room)}</strong></td><td class="num">${money(r.budget)}</td><td class="num">${money(r.spent)}</td><td class="num" style="color:${r.remaining<0?"var(--bad)":"inherit"}">${money(r.remaining)}</td></tr>`).join("")}
      </tbody></table>`:`<div class="empty">No budget lines yet. Add them in the Budget tab.</div>`}
    </div>`;
}

function renderBudget(){
  const el = document.getElementById("view-budget");
  const t = budgetTotals();
  const rows = [...DB.budgetLines].sort((a,b)=> String(a.room).localeCompare(String(b.room)) || String(a.desc).localeCompare(String(b.desc)));
  el.innerHTML = `
    <div class="panel">
      <div class="rowhead"><h2>Budget lines (${rows.length} / ${LITE_LINE_LIMIT} in Lite)</h2><button class="btn primary small" data-act="new-line">+ Add budget line</button></div>
      ${rows.length?`<table class="grid"><thead><tr><th>Room</th><th>Item</th><th class="num">Budget</th><th class="num">Spent</th><th>Over / under</th><th></th></tr></thead><tbody>
        ${rows.map(l=>`<tr>
          <td><strong>${esc(l.room)}</strong>${l.isSample?' <span class="hint">(sample)</span>':''}</td>
          <td>${esc(l.desc)}</td><td class="num">${money(l.budget)}</td><td class="num">${money(l.spent)}</td>
          <td>${overPill(l)}</td>
          <td><div class="actions"><button class="btn small" data-act="edit-line" data-id="${l.id}">Edit</button>
          <button class="btn small danger" data-act="del-line" data-id="${l.id}">Delete</button></div></td></tr>`).join("")}

}

function renderBids(){
  const el = document.getElementById("view-bids");
  el.innerHTML = `
    ${DB.jobs.map(j=>{
      const w = jobWinner(j);
      const bids = [...j.bids].sort((a,b)=>(Number(a.amount)||0)-(Number(b.amount)||0));

        <button class="btn small danger" data-act="del-job" data-id="${j.id}">Delete job</button></div></div>
        ${j.notes?`<p class="hint" style="margin-top:0">${esc(j.notes)}</p>`:""}
        ${bids.length?`<table class="grid"><thead><tr><th>Contractor</th><th class="num">Bid amount</th><th>Notes</th><th></th></tr></thead><tbody>
          ${bids.map(b=>`<tr${w&&w.id===b.id?' style="background:#f0fdf4"':""}>

      ${!DB.jobs.length?`<div class="empty">No jobs yet. Add a job (e.g. "Cabinet installation"), then collect contractor bids for it.</div>`:`<p class="hint">Pick a winning bid per job to lock in your contractor and price.</p>`}
    </div>`;
}

function renderPayments(){
  const el = document.getElementById("view-payments");
  const rows = [...DB.payments].sort((a,b)=> String(a.dueDate||"").localeCompare(String(b.dueDate||"")));
  const total = rows.reduce((s,d)=>s+(Number(d.amount)||0),0);
  el.innerHTML = `
    <div class="panel">
      <div class="rowhead"><h2>Payment draws (${rows.length} / ${LITE_DRAW_LIMIT} in Lite)</h2><button class="btn primary small" data-act="new-draw">+ Add draw</button></div>
      ${rows.length?`<table class="grid"><thead><tr><th>Draw</th><th class="num">Amount</th><th>Due</th><th>Paid</th><th>Status</th><th></th></tr></thead><tbody>
        ${rows.map(d=>`<tr>
          <td><strong>${esc(d.label)}</strong>${d.isSample?' <span class="hint">(sample)</span>':''}</td>
          <td class="num"><strong>${money(d.amount)}</strong></td><td>${fmtDate(d.dueDate)}</td><td>${fmtDate(d.paidDate)}</td>
          <td>${drawPill(d)}</td>
          <td><div class="actions">
            ${drawStatus(d)!=="paid"?`<button class="btn small" data-act="paid-draw" data-id="${d.id}">Mark paid</button>`:""}
            <button class="btn small" data-act="edit-draw" data-id="${d.id}">Edit</button>
            <button class="btn small danger" data-act="del-draw" data-id="${d.id}">Delete</button>
          </div></td></tr>`).join("")}
        <tr><td><strong>Total scheduled</strong></td><td class="num"><strong>${money(total)}</strong></td><td colspan="4"></td></tr>
      </tbody></table>`:`<div class="empty">No payment draws yet. Contractors usually bill in draws (deposit, milestones, final).</div>`}

}

function renderSettings(){
  const el = document.getElementById("view-settings");
  const s = DB.settings;
  el.innerHTML = `
    <div class="panel"><h2>Project profile</h2>
      <p class="hint">This appears on your printed report. Everything is stored only on this computer.</p>
      <form class="f" id="settingsForm">
        <label class="fld"><span>Project name</span><input type="text" name="projectName" value="${esc(s.projectName)}" placeholder="e.g. Kitchen Remodel"></label>
        <label class="fld"><span>Address</span><textarea name="address" placeholder="Street&#10;City, State ZIP">${esc(s.address)}</textarea></label>
        <div class="grid2">
          <label class="fld"><span>Currency</span><select name="currency">
            ${["USD","EUR","GBP","CAD","AUD"].map(c=>`<option ${c===s.currency?"selected":""}>${c}</option>`).join("")}
          </select></label>
          <label class="fld"><span>Contingency (%)</span><input type="number" name="contingencyPct" step="0.1" min="0" value="${esc(s.contingencyPct)}"><span class="hint">Recommended: 10–20% of budget</span></label>
        </div>
        <div><button class="btn primary" type="submit">Save settings</button></div>
      </form>
    </div>
    <div class="panel"><h2>Data</h2>
      <p class="hint">Your data never leaves this browser. Use Export to keep a backup file.</p>
      <div class="actions">
        <button class="btn" data-act="export">Export backup (JSON)</button>
        <button class="btn" data-act="import">Import backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
      </div>
    </div>`;
  document.getElementById("settingsForm").addEventListener("submit", e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    DB.settings.projectName = f.get("projectName"); DB.settings.address = f.get("address");
    DB.settings.currency = f.get("currency"); DB.settings.contingencyPct = Math.max(0, Number(f.get("contingencyPct"))||0);
    save(); renderAll(); toast("Settings saved.");
  });
  document.getElementById("importFile").addEventListener("change", e=>{
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ()=>{ try{ const d=JSON.parse(r.result); if(d.settings&&d.budgetLines&&d.jobs&&d.payments){ DB=d; save(); renderAll(); toast("Backup imported."); } else toast("Not a valid backup file."); }catch(err){ toast("Could not read that file."); } };
    r.readAsText(file);
  });
}

function renderAll(){
  document.getElementById("brandLogo").textContent = DB.settings.projectName || "Renovation Tracker";
  renderDashboard(); renderBudget(); renderBids(); renderPayments(); renderSettings(); refreshSampleBar();
}
</script>
<script>
"use strict";
/* ---------- modal helpers ---------- */

modalRoot().addEventListener("click", e=>{ if(e.target===modalRoot()) closeModal(); });

/* ---------- forms ---------- */

function openJobForm(id){

  openModal(`
    <h2>${id?"Edit job":"New job"}</h2>
    <form class="f" id="jobForm">
      <label class="fld"><span>Job title *</span><input type="text" name="title" required value="${esc(j.title)}" placeholder="e.g. Cabinet installation"></label>
      <label class="fld"><span>Notes</span><textarea name="notes">${esc(j.notes||"")}</textarea></label>

}
function openBidForm(jobId){

  openModal(`
    <h2>Add bid — ${esc(job.title)}</h2>

      <label class="fld"><span>Contractor *</span><input type="text" name="contractor" required placeholder="e.g. Maple City Carpentry"></label>
      <label class="fld"><span>Bid amount (${esc(DB.settings.currency)})</span><input type="number" name="amount" min="0" step="0.01" required></label>
      <label class="fld"><span>Notes</span><textarea name="notes" placeholder="Scope, lead time, what's included…"></textarea></label>
      <div class="foot"><button type="button" class="btn" data-close>Cancel</button>

  document.getElementById("bidForm").addEventListener("submit", e=>{
    e.preventDefault(); const f=new FormData(e.target);
    const ok = persistBid(jobId, {contractor:f.get("contractor").trim(), amount:Number(f.get("amount"))||0, notes:f.get("notes").trim()});
    if(ok) closeModal();

}
function openDrawForm(id){
  const d = id ? DB.payments.find(x=>x.id===id) : {label:"", amount:0, dueDate:todayISO(), paidDate:""};
  openModal(`
    <h2>${id?"Edit draw":"New payment draw"}</h2>
    <form class="f" id="drawForm">
      <label class="fld"><span>Label *</span><input type="text" name="label" required value="${esc(d.label)}" placeholder="e.g. Draw 1 — 50% deposit"></label>
      <label class="fld"><span>Amount (${esc(DB.settings.currency)})</span><input type="number" name="amount" min="0" step="0.01" value="${esc(d.amount)}" required></label>
      <div class="grid2">
        <label class="fld"><span>Due date</span><input type="date" name="dueDate" value="${esc(d.dueDate)}"></label>
        <label class="fld"><span>Paid date (leave blank if unpaid)</span><input type="date" name="paidDate" value="${esc(d.paidDate||"")}"></label>
      </div>
      <div class="foot"><button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">${id?"Save":"Add draw"}</button></div>
    </form>`);

  document.getElementById("drawForm").addEventListener("submit", e=>{
    e.preventDefault(); const f=new FormData(e.target);

/* ---------- print report ---------- */
function reportDocHTML(){
  const s = DB.settings, t = budgetTotals(), rooms = roomSubtotals();
  const cont = t.budget * (Number(s.contingencyPct)||0) / 100;
  const lines = [...DB.budgetLines].sort((a,b)=> String(a.room).localeCompare(String(b.room)));
  const bidHtml = DB.jobs.map(j=>{
    const w = jobWinner(j);
    const bids = [...j.bids].sort((a,b)=>(Number(a.amount)||0)-(Number(b.amount)||0));
    return `<h3>Bid — ${esc(j.title)}</h3>
      ${j.notes?`<p>${esc(j.notes)}</p>`:""}
      ${bids.length?`<table><thead><tr><th>Contractor</th><th class="r">Amount</th><th>Notes</th></tr></thead><tbody>
        ${bids.map(b=>`<tr${w&&w.id===b.id?' class="winner-row"':""}><td>${esc(b.contractor)}${w&&w.id===b.id?" ★ WINNER":""}</td><td class="r">${money(b.amount)}</td><td>${esc(b.notes||"—")}</td></tr>`).join("")}
      </tbody></table>`:"<p>No bids recorded.</p>"}`;
  }).join("");
  const drawRows = [...DB.payments].sort((a,b)=>String(a.dueDate||"").localeCompare(String(b.dueDate||"")))
    .map(d=>`<tr><td>${esc(d.label)}</td><td class="r">${money(d.amount)}</td><td>${fmtDate(d.dueDate)}</td><td>${fmtDate(d.paidDate)}</td><td>${drawStatus(d).toUpperCase()}</td></tr>`).join("");
  return `<div class="doc">
    <div class="doc-head">
      <div><div class="logo">${esc(s.projectName||"Renovation Project")}</div><div class="biz">${esc(s.address)}</div></div>
      <div class="reptitle"><h1>BUDGET REPORT</h1><div class="num">${fmtDate(todayISO())}</div></div>
    </div>
    <h3>Budget lines</h3>
    <table><thead><tr><th>Room</th><th>Item</th><th class="r">Budget</th><th class="r">Spent</th><th class="r">Over / under</th></tr></thead><tbody>
      ${lines.map(l=>{ const ou=lineOverUnder(l);
        return `<tr><td>${esc(l.room)}</td><td>${esc(l.desc)}</td><td class="r">${money(l.budget)}</td><td class="r">${money(l.spent)}</td><td class="r">${ou<0?"("+money(-ou)+" over)":money(ou)+" left"}</td></tr>`; }).join("")}
    </tbody></table>
    <div class="dtotal">
      <div class="r"><span>Total budget</span><span>${money(t.budget)}</span></div>
      <div class="r"><span>Spent to date</span><span>${money(t.spent)}</span></div>
      ${cont?`<div class="r"><span>Contingency (${esc(s.contingencyPct)}%)</span><span>${money(cont)}</span></div>`:""}
      <div class="r grand"><span>Remaining</span><span>${money(t.remaining)}</span></div>
    </div>
    <h3>Budget by room</h3>
    <table><thead><tr><th>Room</th><th class="r">Budget</th><th class="r">Spent</th><th class="r">Remaining</th></tr></thead><tbody>
      ${rooms.map(r=>`<tr><td>${esc(r.room)}</td><td class="r">${money(r.budget)}</td><td class="r">${money(r.spent)}</td><td class="r">${money(r.remaining)}</td></tr>`).join("")}
    </tbody></table>
    ${bidHtml}
    <h3>Payment draws</h3>
    <table><thead><tr><th>Draw</th><th class="r">Amount</th><th>Due</th><th>Paid</th><th>Status</th></tr></thead><tbody>${drawRows}</tbody></table>
    <div class="foot">Generated with Renovation Budget &amp; Bid Tracker · ${fmtDate(todayISO())}</div>
  </div>`;
}
function printReport(){
  document.getElementById("printSheet").innerHTML = reportDocHTML();
  setTimeout(()=>window.print(), 50);
}

/* ---------- global actions ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if(act==="new-line"){ if(!canAddLine()){ showUpgradeNudge("Lite covers 8 budget lines — Pro is unlimited"); return; } openLineForm(); }
  else if(act==="edit-line") openLineForm(id);
  else if(act==="del-line"){ const l=DB.budgetLines.find(x=>x.id===id); if(confirm("Delete budget line \""+l.desc+"\"?")){ DB.budgetLines=DB.budgetLines.filter(x=>x.id!==id); save(); renderAll(); toast("Budget line deleted."); } }
  else if(act==="new-job"){ if(!canAddJob()){ showUpgradeNudge("Lite covers 2 jobs — Pro is unlimited"); return; } openJobForm(); }
  else if(act==="edit-job") openJobForm(id);
  else if(act==="del-job"){ const j=DB.jobs.find(x=>x.id===id); if(confirm("Delete job \""+j.title+"\" and its bids?")){ DB.jobs=DB.jobs.filter(x=>x.id!==id); save(); renderAll(); toast("Job deleted."); } }
  else if(act==="new-bid"){ const j=DB.jobs.find(x=>x.id===id); if(!canAddBid(j)){ showUpgradeNudge("Lite covers 2 bids per job — Pro is unlimited"); return; } openBidForm(id); }
  else if(act==="del-bid"){ const j=DB.jobs.find(x=>x.id===id); if(j.winnerId===b.dataset.bid) j.winnerId=null;
    j.bids=j.bids.filter(x=>x.id!==b.dataset.bid); save(); renderAll(); toast("Bid deleted."); }
  else if(act==="pick-winner"){ const j=DB.jobs.find(x=>x.id===id); j.winnerId=b.dataset.bid; save(); renderAll();
    const w=jobWinner(j); toast("Winner: "+w.contractor+" ("+money(w.amount)+")."); }
  else if(act==="new-draw"){ if(!canAddDraw()){ showUpgradeNudge("Lite covers 3 payment draws — Pro is unlimited"); return; } openDrawForm(); }
  else if(act==="edit-draw") openDrawForm(id);
  else if(act==="del-draw"){ const d=DB.payments.find(x=>x.id===id); if(confirm("Delete draw \""+d.label+"\"?")){ DB.payments=DB.payments.filter(x=>x.id!==id); save(); renderAll(); toast("Draw deleted."); } }
  else if(act==="paid-draw"){ const d=DB.payments.find(x=>x.id===id); d.paidDate=todayISO(); save(); renderAll(); toast(d.label+" marked paid."); }
  else if(act==="print-report") printReport();
  else if(act==="export"){ const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="renovation-tracker-backup.json"; a.click(); toast("Backup downloaded."); }
  else if(act==="import") document.getElementById("importFile").click();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- init ---------- */
load(); renderAll();
document.getElementById("liteUpgradeLink").href = UPGRADE_URL;

/* ---------- hidden QA hooks (query params only; invisible in normal use) ---------- */
(function(){
  const q = new URLSearchParams(location.search);
  if(q.has("print")){
    document.getElementById("printSheet").innerHTML = reportDocHTML();
    document.body.classList.add("print-preview");
    return;
  }
  if(q.get("autotest")==="1"){
    const out = []; const ok=(n,c)=>out.push((c?"PASS":"FAIL")+": "+n);
    const errors=[]; window.onerror=(m)=>{errors.push(m);};
    try{
      // reset to clean sample state
      localStorage.removeItem(LS_KEY); load(); renderAll();
      ok("seed sample data (1 project, 6 lines, 1 job w/ 2 bids, 2 draws)",
        DB.settings.projectName.includes("Maple St") && DB.budgetLines.length===6 &&
        DB.jobs.length===1 && DB.jobs[0].bids.length===2 && DB.payments.length===2);
      // upgrade url wiring
      showUpgradeNudge("Lite covers 8 budget lines — Pro is unlimited");
      const modalBtn = modalRoot().querySelector(".upgradebtn");
      ok("UPGRADE_URL constant + badge + modal button",
        typeof UPGRADE_URL==="string" && UPGRADE_URL==="https://daltonyogurt.gumroad.com/l/iczhnh" &&
        document.getElementById("liteUpgradeLink").getAttribute("href")===UPGRADE_URL &&
        modalBtn && modalBtn.getAttribute("href")===UPGRADE_URL);
      closeModal();
      // budget math on seeded sample: budget=30000, spent=26900, remaining=3100
      const t = budgetTotals();
      ok("budget math (30000 / 26900 / 3100)", t.budget===30000 && t.spent===26900 && t.remaining===3100);
      const rooms = roomSubtotals();
      ok("room subtotals", rooms.length===1 && rooms[0].room==="Kitchen" && rooms[0].budget===30000 && rooms[0].remaining===3100);
      const counterLine = DB.budgetLines.find(l=>l.desc.includes("Countertops"));
      ok("over/under line math (-300)", lineOverUnder(counterLine)===-300);
      // CAP: budget lines — fill to 8, 9th blocked with nudge
      while(DB.budgetLines.length < LITE_LINE_LIMIT){
        persistLine(null,{room:"Test",desc:"Filler "+DB.budgetLines.length,budget:100,spent:0});
      }
      ok("cap: reached 8 lines", DB.budgetLines.length===8 && canAddLine()===false);
      const blockedLine = persistLine(null,{room:"Test",desc:"Over the cap",budget:100,spent:0});
      ok("cap: 9th budget line blocked, not added, nudge shown",
        blockedLine===false && DB.budgetLines.length===8 &&
        modalRoot().classList.contains("open") &&
        modalRoot().textContent.includes("Lite covers 8 budget lines — Pro is unlimited") &&
        modalRoot().textContent.includes("Get the full version"));
      closeModal();
      // editing an existing line still works at the cap
      const edited = persistLine(DB.budgetLines[0].id,{room:"Kitchen",desc:"Cabinets & hardware",budget:12000,spent:11600});
      ok("cap: editing existing line still allowed", edited===true && DB.budgetLines[0].spent===11600);
      // CAP: jobs — 3rd blocked
      const j2ok = persistJob(null,{title:"Second job",notes:""});
      ok("cap: 2nd job allowed", j2ok===true && DB.jobs.length===2);
      const j3blocked = persistJob(null,{title:"Third job",notes:""});
      ok("cap: 3rd job blocked with nudge",
        j3blocked===false && DB.jobs.length===2 &&
        modalRoot().classList.contains("open") && modalRoot().textContent.includes("Lite covers 2 jobs"));
      closeModal();
      // CAP: bids — 3rd bid on job 1 blocked
      const job1 = DB.jobs[0];
      const b3blocked = persistBid(job1.id,{contractor:"Third Bidder",amount:5000,notes:""});
      ok("cap: 3rd bid blocked with nudge",
        b3blocked===false && job1.bids.length===2 &&
        modalRoot().classList.contains("open") && modalRoot().textContent.includes("Lite covers 2 bids per job"));
      closeModal();
      // CAP: draws — fill to 3, 4th blocked
      const d3ok = persistDraw(null,{label:"Draw 3 — final",amount:3000,dueDate:addDays(todayISO(),60),paidDate:""});
      ok("cap: 3rd draw allowed", d3ok===true && DB.payments.length===3);
      const d4blocked = persistDraw(null,{label:"Draw 4 — over cap",amount:1000,dueDate:todayISO(),paidDate:""});
      ok("cap: 4th draw blocked with nudge",
        d4blocked===false && DB.payments.length===3 &&
        modalRoot().classList.contains("open") && modalRoot().textContent.includes("Lite covers 3 payment draws"));
      closeModal();
      // bid winner logic
      const job = DB.jobs[0];
      const before = jobWinner(job);
      ok("seeded winner", !!before && before.contractor==="Maple City Carpentry" && before.amount===3850);
      job.winnerId = job.bids[1].id; save();
      const after = jobWinner(job);
      ok("bid winner re-pick switches", !!after && after.contractor==="Riverbend Remodeling");
      renderAll();
      ok("winner pill renders", document.getElementById("view-bids").textContent.includes("Winner: Riverbend Remodeling"));
      // payment status flags
      const paidD = DB.payments.find(p=>p.paidDate);
      const unpaidFuture = DB.payments.find(p=>!p.paidDate && p.dueDate >= todayISO());
      ok("payment paid flag", paidD && drawStatus(paidD)==="paid");
      ok("payment upcoming flag", unpaidFuture && drawStatus(unpaidFuture)==="upcoming");
      const lateDraw = {dueDate:addDays(todayISO(),-5), paidDate:""};
      ok("payment overdue flag", drawStatus(lateDraw)==="overdue");
      lateDraw.paidDate = todayISO();
      ok("payment mark-paid flips status", drawStatus(lateDraw)==="paid");
      // localStorage round-trip
      save();
      const raw = localStorage.getItem(LS_KEY);
      const parsed = JSON.parse(raw);
      ok("localStorage round-trip", parsed.budgetLines.length===8 && parsed.jobs.length===2 && parsed.payments.length===3 &&
        parsed.settings.projectName===DB.settings.projectName);
      // print CSS hides lite UI
      const styleText = document.querySelector("style").textContent;
      const printCss = styleText.slice(styleText.indexOf("@media print"));
      ok("print css hides lite ui", /#litebar/.test(printCss) && /\.litepill/.test(printCss) && /\.upgradebtn/.test(printCss));
      // report doc builds
      const html = reportDocHTML();
      ok("print report builds", html.includes("Maple St") && html.includes("Budget lines") &&
        html.includes("Maple City Carpentry") && html.includes("Payment draws") && html.includes("BUDGET REPORT"));
      // dashboard renders
      renderDashboard();
      ok("dashboard renders", document.getElementById("view-dashboard").textContent.length>100);
      // sample clear
      const realLinesBefore = DB.budgetLines.filter(l=>!l.isSample).length;
      clearSample();
      ok("clear sample data", DB.budgetLines.length===realLinesBefore && DB.jobs.every(j=>!j.isSample) &&
        DB.payments.every(p=>!p.isSample) && DB.budgetLines.every(l=>!l.isSample));
      ok("no js errors", errors.length===0);
    }catch(err){ out.push("FAIL: exception "+err.message); }
    const pass=out.filter(l=>l.startsWith("PASS")).length, fail=out.filter(l=>l.startsWith("FAIL")).length;
    document.title="AUTOTEST:"+(fail===0?"PASS":"FAIL")+" ("+pass+"/"+(pass+fail)+")";
    const d=document.getElementById("autotest-output"); d.style.display="block"; d.textContent=out.join("\n");
    closeModal();
  }
})();
</script>
</body>
</html>
